name: CodeQL + Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: security-extended

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3

  docker:
    name: Docker Build & Run
    runs-on: ubuntu-latest
    needs: analyze

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t go-web-server .

      - name: Run Docker container
        run: docker run -d --name go-web-test -p 127.0.0.1:8080:8080 go-web-server

      - name: Test readfile endpoint
        run: |
          for i in {1..20}; do
            if docker exec go-web-test sh -c \
              'wget -qO- "http://127.0.0.1:8080/readfile?file=safe-files/hello.txt"' \
              | grep -q "Hello World"; then
              echo "Docker endpoint test passed"
              exit 0
            fi
            sleep 2
          done
          docker logs go-web-test
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f go-web-test || true
